## Copy to inventory.ini, fill in real hosts, then encrypt it:  ansible-vault encrypt inventory.ini
## Run with:  ansible-playbook site.yml --ask-vault-pass
## Connect as an unprivileged sudo user (never root). Passwords stay safe because the whole file is vault-encrypted.
## If SSH listens on a non-default port or is port-forwarded, add ansible_port=<port> to the host line.

[standalone]
# Standalone Ubuntu 24.04 servers (base OS hardening)
srv-app-01 ansible_host=10.0.0.10 ansible_user=admin ansible_ssh_pass="XXXXX" ansible_become_password="XXXXX"

[docker_nodes]
# Docker hosts (base OS + Docker daemon hardening)
srv-docker-01 ansible_host=10.0.0.20 ansible_user=admin ansible_ssh_pass="XXXXX" ansible_become_password="XXXXX"

[k8s_nodes]
# Kubernetes nodes (base OS + node hardening)
k8s-node-01 ansible_host=10.0.0.30 ansible_user=admin ansible_ssh_pass="XXXXX" ansible_become_password="XXXXX"
k8s-node-02 ansible_host=10.0.0.31 ansible_user=admin ansible_ssh_pass="XXXXX" ansible_become_password="XXXXX"

# Optional: nodes that also run the control plane (open API server / etcd ports). Without this group,
# every node in k8s_nodes is treated as a control-plane node.
# [k8s_control_plane]
# k8s-node-01

[db_nodes]
# Database servers (base OS + PostgreSQL hardening)
srv-db-01 ansible_host=10.0.0.40 ansible_user=admin ansible_ssh_pass="XXXXX" ansible_become_password="XXXXX"

[web_nodes]
# Web servers (base OS + Nginx hardening)
srv-web-01 ansible_host=10.0.0.50 ansible_user=admin ansible_ssh_pass="XXXXX" ansible_become_password="XXXXX"

[hardening_targets:children]
standalone
docker_nodes
k8s_nodes
db_nodes
web_nodes

[all:vars]
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
