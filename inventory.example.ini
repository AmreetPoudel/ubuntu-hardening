# Production Hardening Inventory Example
# Copy this file to inventory.ini and update host IPs, users, and passwords.
# Note: Keep inventory.ini encrypted with Ansible Vault (ansible-vault encrypt inventory.ini)

[standalone]
# Standalone Ubuntu 24.04 servers (Applies full hardening controls)
srv-app-01 ansible_host=10.0.0.10 ansible_user=admin ansible_ssh_pass="CHANGE_ME" ansible_become_password="CHANGE_ME"

[docker_nodes]
# Docker Host Nodes (Protects Docker bridge/overlay networking and cgroups)
srv-docker-01 ansible_host=10.0.0.20 ansible_user=admin ansible_ssh_pass="CHANGE_ME" ansible_become_password="CHANGE_ME"

[k8s_nodes]
# Kubernetes Controlplane and Worker Nodes (Protects br_netfilter, ip_forward, and pod traffic)
k8s-node-01 ansible_host=10.0.0.30 ansible_user=admin ansible_ssh_pass="CHANGE_ME" ansible_become_password="CHANGE_ME"
k8s-node-02 ansible_host=10.0.0.31 ansible_user=admin ansible_ssh_pass="CHANGE_ME" ansible_become_password="CHANGE_ME"

[hardening_targets:children]
standalone
docker_nodes
k8s_nodes

[all:vars]
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
