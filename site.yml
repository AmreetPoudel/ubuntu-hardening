---
# Full run: harden the base OS, apply workload-specific hardening, then audit the result.
# Every step can also be run on its own (see playbooks/ and the README).
- name: Base OS hardening
  ansible.builtin.import_playbook: playbooks/base_os.yml

- name: Docker host hardening
  ansible.builtin.import_playbook: playbooks/docker_host.yml

- name: Kubernetes node hardening
  ansible.builtin.import_playbook: playbooks/k8s_node.yml

- name: Database server hardening
  ansible.builtin.import_playbook: playbooks/database_server.yml

- name: Web server hardening
  ansible.builtin.import_playbook: playbooks/web_server.yml

- name: Compliance audit
  ansible.builtin.import_playbook: playbooks/audit_compliance.yml
