---
# Docker hosts: keep container networking and package management working.
# Note: ports published with `docker run -p` bypass UFW (Docker writes its own iptables rules);
# restrict them with the DOCKER-USER chain or bind to 127.0.0.1.

sysctl_overrides:
  net.ipv4.ip_forward: 1

tmp_mount_options: "nosuid,nodev"
ufw_default_routed: allow

# Docker Engine and containerd are upgraded deliberately, not by unattended-upgrades.
unattended_upgrades_blacklist:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin

# Swarm overlay ports; only opened when swarm is used.
docker_swarm_enabled: false
docker_swarm_rules:
  - { port: 2377, proto: tcp, comment: "Docker Swarm management" }
  - { port: 7946, proto: tcp, comment: "Docker Swarm discovery" }
  - { port: 7946, proto: udp, comment: "Docker Swarm discovery" }
  - { port: 4789, proto: udp, comment: "Docker overlay network" }
ufw_rules_extra: "{{ docker_swarm_rules if docker_swarm_enabled | bool else [] }}"
