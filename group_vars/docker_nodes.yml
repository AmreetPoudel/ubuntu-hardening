---
# Workload Overrides for Docker Hosts
# Preserves container engine networking, cgroups, and storage drivers

sysctl_ip_forward: 1
proc_hidepid_level: 0
tmp_mount_options: "defaults,rw,nosuid,nodev"
ufw_default_forward_policy: "accept"

# Docker required ports (e.g. Swarm if enabled, Docker daemon REST API if TLS enabled)
ufw_allow_docker_ports:
  - 2377/tcp
  - 7946/tcp
  - 7946/udp
  - 4789/udp
