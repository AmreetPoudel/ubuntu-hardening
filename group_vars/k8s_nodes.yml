---
# Workload Overrides for Kubernetes Controlplane and Worker Nodes
# Preserves CNI plugin networking, kubelet, etcd, and pod overlay bridges

sysctl_ip_forward: 1
sysctl_bridge_nf_call_iptables: 1
proc_hidepid_level: 0
tmp_mount_options: "defaults,rw,nosuid,nodev"
ufw_default_forward_policy: "accept"

# Essential Kubernetes ports (Kube-API, Kubelet, Etcd, Flannel/Calico CNI)
ufw_allow_k8s_ports:
  - 6443/tcp   # Kubernetes API Server
  - 2379/tcp   # etcd client requests
  - 2380/tcp   # etcd peer communication
  - 10250/tcp  # Kubelet API
  - 10259/tcp  # kube-scheduler
  - 10257/tcp  # kube-controller-manager
  - 30000:32767/tcp # NodePort Services
  - 8472/udp   # Flannel VXLAN overlay
  - 4789/udp   # Calico VXLAN
