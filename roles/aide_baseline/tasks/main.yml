---
# Building the baseline can take several minutes on large filesystems, so it runs asynchronously.
- name: Configure AIDE file integrity monitoring
  when: aide_enabled | bool
  block:
    - name: Install AIDE
      ansible.builtin.apt:
        name:
          - aide
          - aide-common
        state: present
        lock_timeout: 300

    - name: Check for an existing AIDE baseline
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db
      register: aide_baseline_db

    - name: Build the AIDE baseline database
      ansible.builtin.command: aideinit --yes --force
      environment:
        DEBIAN_FRONTEND: noninteractive
      async: "{{ aide_init_timeout }}"
      poll: 15
      changed_when: true
      when: not aide_baseline_db.stat.exists

    - name: Activate the new baseline
      ansible.builtin.copy:
        src: /var/lib/aide/aide.db.new
        dest: /var/lib/aide/aide.db
        remote_src: true
        force: false
        owner: root
        group: root
        mode: "0600"
