---
- name: Allow specific application ports and services in UFW
  block:

    - name: Allow custom services in UFW
      community.general.ufw:
        rule: allow
        name: "{{ item }}"
      loop: "{{ ufw_allowed_services }}"
      when: ufw_allowed_services | length > 0

    - name: Allow custom ports in UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
      loop: "{{ ufw_allowed_ports }}"
      when: ufw_allowed_ports | length > 0

    - name: Allow Docker profile ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
      loop: "{{ ufw_allow_docker_ports | default([]) }}"
      when: ufw_allow_docker_ports is defined

    - name: Allow Kubernetes profile ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
      loop: "{{ ufw_allow_k8s_ports | default([]) }}"
      when: ufw_allow_k8s_ports is defined

  rescue:
    - name: Show failure message but keep going
      ansible.builtin.debug:
        msg: "WARNING: ufw_allowed_services failed on {{ inventory_hostname }}, check manually."
