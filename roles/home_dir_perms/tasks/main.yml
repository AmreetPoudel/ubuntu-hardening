---
# Only home directories that belong to a real local account are touched (never a stray directory in /home).
- name: Read local accounts
  ansible.builtin.getent:
    database: passwd

- name: Find directories in /home
  ansible.builtin.find:
    paths: /home
    file_type: directory
    recurse: false
  register: home_dir_perms_found

- name: Select home directories of regular accounts
  ansible.builtin.set_fact:
    home_dir_perms_homes: >-
      {% set out = [] -%}
      {% for name, pw in ansible_facts.getent_passwd.items() -%}
      {% if 1000 <= pw[1] | int < 60000 and name not in home_dir_exclude_users and pw[4] in home_dir_perms_found.files | map(attribute='path') -%}
      {% set _ = out.append(pw[4]) -%}
      {% endif -%}
      {% endfor -%}
      {{ out | to_json }}

- name: Restrict home directory permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "{{ home_dir_mode }}"
  loop: "{{ home_dir_perms_homes | from_json if home_dir_perms_homes is string else home_dir_perms_homes }}"
