---
# dpkg-statoverride makes the change survive package upgrades, which would otherwise restore the SUID bit.
- name: Check which binaries exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ suid_strip_binaries }}"
  register: suid_strip_stat

- name: Look for existing dpkg overrides
  ansible.builtin.command: "dpkg-statoverride --list {{ item.item }}"
  loop: "{{ suid_strip_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: suid_strip_overrides
  changed_when: false
  failed_when: false
  check_mode: false
  when: item.stat.exists

- name: Remove the SUID/SGID bit persistently
  ansible.builtin.command: "dpkg-statoverride --update --add root root 0755 {{ item.item.item }}"
  loop: "{{ suid_strip_overrides.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  changed_when: true
  when:
    - item.rc is defined
    - item.rc != 0
