---
- name: Apply Nginx web server security hardening
  block:

    - name: Check if Nginx directory exists
      ansible.builtin.stat:
        path: /etc/nginx
      register: nginx_dir

    - name: Deploy Nginx security drop-in
      ansible.builtin.template:
        src: security.conf.j2
        dest: /etc/nginx/conf.d/security.conf
        owner: root
        group: root
        mode: '0644'
      when: nginx_dir.stat.exists
      notify: reload nginx

  rescue:
    - name: Show failure message but keep going
      ansible.builtin.debug:
        msg: "WARNING: nginx_hardening failed on {{ inventory_hostname }}, check manually."
