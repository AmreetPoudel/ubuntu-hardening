---
# The banner deliberately contains no \v \r \m \n escapes, which would leak OS and kernel versions.
- name: Set the legal warning banner
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: "{{ login_banner_text }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/issue
    - /etc/issue.net
