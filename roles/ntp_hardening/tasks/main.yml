---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    lock_timeout: 300

- name: Deploy chrony hardening drop-in
  ansible.builtin.copy:
    dest: /etc/chrony/conf.d/10-hardening.conf
    content: |
      # Managed by Ansible (linux-hardening)
      {% if chrony_disable_cmdport | bool %}
      # chronyc talks over the local unix socket; do not expose the UDP command port.
      cmdport 0
      {% endif %}
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Configure custom time sources
  ansible.builtin.copy:
    dest: /etc/chrony/sources.d/hardening.sources
    content: |
      # Managed by Ansible (linux-hardening)
      {% for server in chrony_servers %}
      server {{ server }} iburst
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: chrony_servers | length > 0
  notify: Restart chrony

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
