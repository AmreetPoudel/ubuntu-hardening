---
- name: Install and configure Chrony time synchronization
  block:

    - name: Install chrony package
      ansible.builtin.apt:
        name: chrony
        state: present

    - name: Enable and start chrony service
      ansible.builtin.service:
        name: chrony
        enabled: true
        state: started

  rescue:
    - name: Show failure message but keep going
      ansible.builtin.debug:
        msg: "WARNING: ntp_hardening failed on {{ inventory_hostname }}, check manually."
