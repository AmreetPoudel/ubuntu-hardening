---
# Only units that exist on the host are touched, so the list can safely name services
# that are absent on most machines.

- name: List installed systemd unit files
  ansible.builtin.command: systemctl list-unit-files --no-legend --no-pager  # noqa: command-instead-of-module
  register: services_disable_unit_files
  changed_when: false
  check_mode: false

- name: Stop and disable unused network services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ services_disable_units | intersect(services_disable_unit_files.stdout_lines | map('split') | map('first') | list) }}"
