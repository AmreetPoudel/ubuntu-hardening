---
# Users who already own a crontab stay allowed, otherwise their jobs would silently stop running.
- name: Check for cron and at
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/sbin/cron
    - /usr/bin/at
  register: cron_at_installed

- name: Find existing crontabs
  ansible.builtin.find:
    paths: /var/spool/cron/crontabs
    file_type: file
  register: cron_at_crontabs

- name: Allow only approved users to use cron
  ansible.builtin.copy:
    dest: /etc/cron.allow
    content: "{{ (['root'] + cron_allowed_users + cron_at_crontabs.files | map(attribute='path') | map('basename') | list) | unique | sort | join('\n') }}\n"
    owner: root
    group: crontab
    mode: "0640"
  when: cron_at_installed.results[0].stat.exists

- name: Remove cron.deny
  ansible.builtin.file:
    path: /etc/cron.deny
    state: absent
  when: cron_at_installed.results[0].stat.exists

- name: Allow only approved users to use at
  ansible.builtin.copy:
    dest: /etc/at.allow
    content: "{{ (['root'] + cron_allowed_users) | unique | sort | join('\n') }}\n"
    owner: root
    group: daemon
    mode: "0640"
  when: cron_at_installed.results[1].stat.exists

- name: Remove at.deny
  ansible.builtin.file:
    path: /etc/at.deny
    state: absent
  when: cron_at_installed.results[1].stat.exists
