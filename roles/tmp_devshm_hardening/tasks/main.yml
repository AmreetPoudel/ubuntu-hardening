---
# Ubuntu does not mount /tmp separately by default. Mounting a fresh tmpfs over a live /tmp would hide
# files in use, so /tmp is persisted in fstab (effective at next boot) and only remounted with the new
# options when it already is a mount point. /dev/shm is always a mount and can be remounted live.

- name: Harden temporary filesystem mounts
  ansible.builtin.include_tasks: mount.yml
  loop:
    - { path: /tmp, options: "{{ tmp_mount_options }}", size: "{{ tmp_tmpfs_size }}" }
    - { path: /dev/shm, options: "{{ dev_shm_mount_options }}", size: "" }
  loop_control:
    loop_var: mnt
    label: "{{ mnt.path }}"
  when: tmp_mount_manage | bool

- name: Ensure sticky bit on world-writable temporary directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "1777"
  loop:
    - /tmp
    - /var/tmp
