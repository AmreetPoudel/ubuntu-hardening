---
- name: Check which sensitive paths exist on this host
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ sensitive_files }}"
  loop_control:
    label: "{{ item.path }}"
  register: sensitive_file_perms_stat

- name: Enforce ownership and permissions on sensitive files and directories
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: "{{ item.item.state | default('file') }}"
    owner: "{{ item.item.owner | default('root') }}"
    group: "{{ item.item.group | default('root') }}"
    mode: "{{ item.item.mode }}"
  loop: "{{ sensitive_file_perms_stat.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: item.stat.exists

- name: Find SSH host private keys
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: "ssh_host_*_key"
  register: sensitive_file_perms_hostkeys

- name: Restrict SSH host private keys
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ sensitive_file_perms_hostkeys.files }}"
  loop_control:
    label: "{{ item.path }}"
