---
- name: Read local accounts
  ansible.builtin.getent:
    database: passwd

- name: Select system accounts that still have a login shell
  ansible.builtin.set_fact:
    service_account_targets: >-
      {% set out = [] -%}
      {% for name, pw in ansible_facts.getent_passwd.items() -%}
      {% if 0 < pw[1] | int < 1000 and name not in service_account_shell_exclude and name != ansible_user
            and pw[5] not in ['/usr/sbin/nologin', '/sbin/nologin', '/bin/false', '/usr/bin/false'] -%}
      {% set _ = out.append(name) -%}
      {% endif -%}
      {% endfor -%}
      {{ out | to_json }}

- name: Set a non-login shell for system accounts
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /usr/sbin/nologin
  loop: "{{ service_account_targets | from_json if service_account_targets is string else service_account_targets }}"
