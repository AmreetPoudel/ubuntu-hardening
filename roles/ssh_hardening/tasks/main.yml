---
- name: Harden SSH daemon configuration
  block:

    - name: Deploy hardened sshd_config drop-in file
      ansible.builtin.template:
        src: sshd_config.j2
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: '0600'
      notify: restart sshd

  rescue:
    - name: Show failure message but keep going
      ansible.builtin.debug:
        msg: "WARNING: ssh_hardening failed on {{ inventory_hostname }}, check manually."
