---
# Reload (SIGHUP) keeps existing sessions alive; a restart is never needed for config changes.
- name: Reload sshd
  ansible.builtin.command: systemctl try-reload-or-restart ssh.service  # noqa: command-instead-of-module
  changed_when: true

- name: Restart ssh socket
  ansible.builtin.systemd:
    name: ssh.socket
    state: restarted
    daemon_reload: true
