---
- name: Configure fail2ban
  block:
    - name: Deploy jail configuration
      ansible.builtin.template:
        src: hardening.local.j2
        dest: /etc/fail2ban/jail.d/hardening.local
        owner: root
        group: root
        mode: "0644"
      register: fail2ban_jail
      notify: Restart fail2ban

    - name: Test the fail2ban configuration
      ansible.builtin.command: fail2ban-client --test
      changed_when: false
      check_mode: false

  rescue:
    - name: Remove the jail configuration that failed validation
      ansible.builtin.file:
        path: /etc/fail2ban/jail.d/hardening.local
        state: absent

    - name: Stop, fail2ban rejected the generated configuration
      ansible.builtin.fail:
        msg: "fail2ban rejected the generated jail configuration on {{ inventory_hostname }}; it was removed. Check ignoreip/ban values."

- name: Remove jail files from earlier versions of this framework
  ansible.builtin.file:
    path: "/etc/fail2ban/jail.d/{{ item }}"
    state: absent
  loop:
    - sshd.local
    - sudo.local
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
