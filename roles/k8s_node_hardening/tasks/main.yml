---
- name: Apply Kubernetes Node & Kubelet hardening
  block:

    - name: Disable swap memory for Kubelet stability
      ansible.builtin.command: swapoff -a
      when: k8s_disable_swap | bool
      changed_when: false
      failed_when: false

    - name: Remove swap entry from /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'
      when: k8s_disable_swap | bool

    - name: Secure permissions on Kubelet configuration files if present
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0600'
        owner: root
        group: root
      loop:
        - "/var/lib/kubelet/config.yaml"
        - "/etc/kubernetes/kubelet.conf"
        - "/etc/kubernetes/admin.conf"
      failed_when: false

  rescue:
    - name: Show failure message but keep going
      ansible.builtin.debug:
        msg: "WARNING: k8s_node_hardening failed on {{ inventory_hostname }}, check manually."
