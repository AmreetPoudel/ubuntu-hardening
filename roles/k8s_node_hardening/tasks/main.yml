---
# Node-level (OS) hardening only. Kubelet flags and cluster components are deliberately not edited here:
# changing them on a running cluster belongs in the cluster's own lifecycle tooling.

- name: Prepare kernel modules and networking sysctls for the container runtime and CNI
  when: k8s_manage_kernel_modules | bool
  block:
    - name: Load kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          # Managed by Ansible (linux-hardening)
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load kernel modules now
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Deploy Kubernetes networking sysctls
      ansible.builtin.template:
        src: 98-kubernetes.conf.j2
        dest: /etc/sysctl.d/98-kubernetes.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload Kubernetes sysctl settings

- name: Disable swap
  when: k8s_disable_swap | bool
  block:
    - name: Refuse to swap off when memory could not absorb the swapped-out pages
      ansible.builtin.assert:
        that: >-
          (ansible_facts['swaptotal_mb'] - ansible_facts['swapfree_mb'])
          < (ansible_facts['memory_mb']['nocache']['free'] * 0.8)
        fail_msg: >-
          Swap on {{ inventory_hostname }} holds more data than free memory can take; disabling it now could trigger the OOM killer.
          Drain the node or free memory first.
        quiet: true
      when: ansible_facts['swaptotal_mb'] > 0

    - name: Turn swap off
      ansible.builtin.command: swapoff -a
      changed_when: true
      when: ansible_facts['swaptotal_mb'] > 0

    - name: Comment swap entries out of fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\n].*\s+swap\s+.*)$'
        replace: '# \1'
        backup: true

- name: Restrict Kubernetes configuration files
  block:
    - name: Check which configuration files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ k8s_config_files }}"
      register: k8s_node_config_stat

    - name: Set owner and mode on configuration files
      ansible.builtin.file:
        path: "{{ item.item }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ k8s_node_config_stat.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists

    - name: Find private keys and static pod manifests
      ansible.builtin.find:
        paths: "{{ item.path }}"
        patterns: "{{ item.pattern }}"
        recurse: true
      loop:
        - { path: /etc/kubernetes/pki, pattern: "*.key" }
        - { path: /etc/kubernetes/manifests, pattern: "*.yaml" }
      register: k8s_node_sensitive

    - name: Restrict private keys and manifests
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ k8s_node_sensitive.results | map(attribute='files') | flatten }}"
      loop_control:
        label: "{{ item.path }}"
