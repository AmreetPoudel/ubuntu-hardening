---
- name: Restrict SSH access in UFW
  block:

    - name: Allow SSH port in UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        from_ip: "{{ ssh_allowed_src }}"
      loop: "{{ ufw_allow_ssh_ports }}"

  rescue:
    - name: Show failure message but keep going
      ansible.builtin.debug:
        msg: "WARNING: ufw_ssh_restriction failed on {{ inventory_hostname }}, check manually."
