---
- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy journald hardening drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-hardening.conf
    content: |
      # Managed by Ansible (linux-hardening)
      [Journal]
      Storage={{ journald_storage }}
      Compress={{ journald_compress }}
      ForwardToSyslog={{ journald_forward_to_syslog }}
      {% if journald_system_max_use | length > 0 %}
      SystemMaxUse={{ journald_system_max_use }}
      {% endif %}
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
