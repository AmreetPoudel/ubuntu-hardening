---
- name: Deploy sudo security defaults
  ansible.builtin.template:
    src: 99-sudo-hardening.j2
    dest: /etc/sudoers.d/99-sudo-hardening
    owner: root
    group: root
    mode: "0440"
    # A syntax error in sudoers locks everybody out of sudo; never install an unvalidated file.
    validate: /usr/sbin/visudo -cf %s

- name: Rotate the sudo log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/sudo-hardening
    content: |
      # Managed by Ansible (linux-hardening)
      {{ sudo_logfile }} {
          weekly
          rotate 13
          compress
          missingok
          notempty
          create 0600 root root
      }
    owner: root
    group: root
    mode: "0644"
