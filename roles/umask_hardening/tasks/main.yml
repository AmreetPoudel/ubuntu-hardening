---
- name: Set default UMASK in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*UMASK\b'
    line: "UMASK\t\t{{ system_umask }}"
    backup: true

- name: Set umask for login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/99-umask.sh
    content: |
      # Managed by Ansible (linux-hardening)
      umask {{ system_umask }}
    owner: root
    group: root
    mode: "0644"
