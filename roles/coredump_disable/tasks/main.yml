---
- name: Set core dump limits to 0
  ansible.builtin.copy:
    dest: /etc/security/limits.d/10-disable-coredumps.conf
    content: |
      # Managed by Ansible (linux-hardening)
      * hard core 0
      * soft core 0
    owner: root
    group: root
    mode: "0644"

- name: Ensure systemd coredump drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable systemd coredump storage
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/10-hardening.conf
    content: |
      # Managed by Ansible (linux-hardening)
      [Coredump]
      Storage=none
      ProcessSizeMax=0
    owner: root
    group: root
    mode: "0644"
