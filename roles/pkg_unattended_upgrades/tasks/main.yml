---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    lock_timeout: 300

- name: Configure periodic package updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended-upgrades behaviour
  ansible.builtin.template:
    src: 52unattended-upgrades-hardening.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-hardening
    owner: root
    group: root
    mode: "0644"

- name: Remove configuration file from earlier versions of this framework
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/auto-upgrades
    state: absent

- name: Ensure the apt timers that drive unattended upgrades are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{{ unattended_upgrades_enabled | bool }}"
    state: "{{ 'started' if unattended_upgrades_enabled | bool else 'stopped' }}"
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
