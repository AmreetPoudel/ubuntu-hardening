---
- name: Enforce idle timeout for interactive shells
  ansible.builtin.copy:
    dest: /etc/profile.d/99-tmout.sh
    content: |
      # Managed by Ansible (linux-hardening)
      # Assign only when needed: TMOUT is read-only after the first login script ran.
      [ "${TMOUT:-}" = "{{ shell_idle_timeout }}" ] || TMOUT={{ shell_idle_timeout }}
      readonly TMOUT
      export TMOUT
    owner: root
    group: root
    mode: "0644"

- name: Remove script from earlier versions of this framework
  ansible.builtin.file:
    path: /etc/profile.d/99-timeout.sh
    state: absent
