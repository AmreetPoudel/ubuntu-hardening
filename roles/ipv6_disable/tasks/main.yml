---
- name: Configure IPv6 hardening
  block:

    - name: Disable or harden IPv6 via sysctl
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-ipv6-hardening.conf
        reload: true
      loop:
        - { name: 'net.ipv6.conf.all.disable_ipv6', value: "{{ '1' if disable_ipv6 else '0' }}" }
        - { name: 'net.ipv6.conf.default.disable_ipv6', value: "{{ '1' if disable_ipv6 else '0' }}" }
        - { name: 'net.ipv6.conf.all.accept_ra', value: '0' }
        - { name: 'net.ipv6.conf.default.accept_ra', value: '0' }

  rescue:
    - name: Show failure message but keep going
      ansible.builtin.debug:
        msg: "WARNING: ipv6_disable failed on {{ inventory_hostname }}, check manually."
