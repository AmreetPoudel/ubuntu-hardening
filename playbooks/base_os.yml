---
# Base OS hardening for every managed host. Roles are ordered so that anything that installs packages runs
# before controls that would get in its way (noexec /tmp), and so that SSH is never firewalled or reconfigured
# before the firewall already allows it.
- name: Ubuntu 24.04 base OS hardening
  hosts: standalone:docker_nodes:k8s_nodes:db_nodes:web_nodes
  become: true
  gather_facts: true
  serial: "{{ hardening_serial | default('25%') }}"
  max_fail_percentage: 0
  # A failed task must not discard handlers already notified (reloads/restarts of changed config).
  force_handlers: true

  roles:
    - { role: preflight, tags: [always] }
    # Your SSH key first: key login keeps working even if a later step fails
    - { role: ssh_authorized_keys, tags: [ssh_authorized_keys, auth, ssh] }

    # Packages and updates
    - { role: pkg_remove_legacy, tags: [pkg_remove_legacy, packages] }
    - { role: pkg_install_hardening_tools, tags: [pkg_install_hardening_tools, packages] }
    - { role: pkg_unattended_upgrades, tags: [pkg_unattended_upgrades, packages] }
    - { role: ntp_hardening, tags: [ntp_hardening, os_baseline] }

    # OS baseline
    - { role: kernel_module_blacklist, tags: [kernel_module_blacklist, os_baseline] }
    - { role: sysctl_hardening, tags: [sysctl_hardening, os_baseline] }
    - { role: coredump_disable, tags: [coredump_disable, os_baseline] }
    - { role: shell_tmout, tags: [shell_tmout, os_baseline] }
    - { role: umask_hardening, tags: [umask_hardening, os_baseline] }
    - { role: services_disable, tags: [services_disable, os_baseline] }
    - { role: apparmor_enforce, tags: [apparmor_enforce, os_baseline] }
    - { role: dns_resolver_hardening, tags: [dns_resolver_hardening, os_baseline] }

    # Authentication and access control
    - { role: root_lockout, tags: [root_lockout, auth] }
    - { role: pam_hardening, tags: [pam_hardening, auth] }
    - { role: password_aging, tags: [password_aging, auth] }
    - { role: sudo_hardening, tags: [sudo_hardening, auth] }
    - { role: login_banners, tags: [login_banners, auth] }

    # Files and accounts
    - { role: sensitive_file_perms, tags: [sensitive_file_perms, filesystem] }
    - { role: home_dir_perms, tags: [home_dir_perms, filesystem] }
    - { role: suid_strip_nonessential, tags: [suid_strip_nonessential, filesystem] }
    - { role: cron_at_restriction, tags: [cron_at_restriction, filesystem] }
    - { role: service_account_hardening, tags: [service_account_hardening, filesystem] }

    # Network: firewall first, then fail2ban, then SSH itself
    - { role: ufw_firewall, tags: [ufw_firewall, network] }
    - { role: fail2ban, tags: [fail2ban, network] }
    - { role: ssh_hardening, tags: [ssh_hardening, network, ssh] }

    # Logging and auditing
    - { role: rsyslog_hardening, tags: [rsyslog_hardening, logging] }
    - { role: journald_hardening, tags: [journald_hardening, logging] }
    - { role: auditd_rules, tags: [auditd_rules, logging] }
    - { role: log_file_perms, tags: [log_file_perms, logging] }

    # Last: noexec /tmp must not interfere with package installs above; AIDE baselines the finished state
    - { role: tmp_devshm_hardening, tags: [tmp_devshm_hardening, os_baseline] }
    - { role: aide_baseline, tags: [aide_baseline, logging] }
